name: Windows Desktop - GPU compatibility

on:
  push:
    branches: [main]
    paths:
      - 'apps/rustgis/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-desktop-gpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate build
        run: cargo check --locked -p rustgis
      - name: Build Windows desktop (OpenGL compatibility default)
        run: cargo build --release --locked -p rustgis
      - name: Smoke-test executable
        shell: pwsh
        run: |
          & "target/release/rustgis.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "rustgis.exe --version failed" }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: viRustGIS-Windows-x64-OpenGL
          path: target/release/rustgis.exe
          if-no-files-found: error
